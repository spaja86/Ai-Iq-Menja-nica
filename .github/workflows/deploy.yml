name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tooling
        run: npm install -g htmlhint linkinator vercel

      - name: HTML validation
        run: htmlhint "**/*.html"

      - name: Internal link validation
        run: linkinator . --recurse --skip "mailto:.*" --skip "https://(www\\.)?(instagram|facebook|youtube|tiktok)\\.com/.*"

      - name: Install Vercel CLI
        run: vercel --version

      - name: Deploy to Vercel
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Post-deploy smoke check
        if: ${{ secrets.PRODUCTION_HEALTHCHECK_URL != '' }}
        run: |
          curl -fL --max-time 20 "${{ secrets.PRODUCTION_HEALTHCHECK_URL }}" > /dev/null
          echo "Smoke check passed for ${{ secrets.PRODUCTION_HEALTHCHECK_URL }}"
