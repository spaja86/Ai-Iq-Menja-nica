name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Install validation tooling
        run: npm install -g htmlhint linkinator

      - name: JavaScript tests
        run: node --test js/*.test.js

      - name: HTML validation
        run: htmlhint "**/*.html"

      - name: Metadata quality checks
        run: |
          set -euo pipefail
          pages=(
            index.html
            services.html
            contact.html
            trade.html
            wallet.html
            education.html
            about.html
            licensing.html
            institutional.html
            partner-onboarding.html
            trust-center.html
          )

          for page in "${pages[@]}"; do
            grep -q 'rel="canonical"' "$page"
            grep -q 'property="og:title"' "$page"
            grep -q 'property="og:description"' "$page"
          done

      - name: Content governance checks
        run: |
          set -euo pipefail
          grep -q 'spajicn@yahoo.com' contact.html
          grep -q 'spajicn@yahoo.com' licensing.html
          grep -q 'spajicn@yahoo.com' institutional.html
          grep -q 'spajicn@yahoo.com' partner-onboarding.html
          grep -q 'spajicn@yahoo.com' trust-center.html
          grep -qi 'formalni kanal' trust-center.html
          grep -qi 'demo/simulirane' index.html
          grep -qi 'simulirani podaci' trade.html
          grep -qi 'Demo wallet' wallet.html
          grep -q 'serviceCatalog' services.html

      - name: Internal link validation
        run: linkinator . --recurse --skip "mailto:.*" --skip "https://(www\\.)?(instagram|facebook|youtube|tiktok)\\.com/.*" --skip "https://spaja86\\.github\\.io/Ai-Iq-World-Bank.*" --skip "https://spaja86\\.github\\.io/IO-OPENUI-AO.*" --skip "https://spaja86\\.github\\.io/Kompanija-SPAJA.*"

      - name: Secret scan gate
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: validate
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel --prod --token="$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Post-deploy smoke check (single URL)
        env:
          PRODUCTION_HEALTHCHECK_URL: ${{ secrets.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          [[ -n "$PRODUCTION_HEALTHCHECK_URL" ]] || exit 0
          curl -fL --max-time 20 "$PRODUCTION_HEALTHCHECK_URL" > /dev/null
          echo "Smoke check passed"

      - name: Post-deploy smoke checks (multiple URLs)
        env:
          PRODUCTION_HEALTHCHECK_URLS: ${{ secrets.PRODUCTION_HEALTHCHECK_URLS }}
        run: |
          [[ -n "$PRODUCTION_HEALTHCHECK_URLS" ]] || exit 0
          IFS=',' read -ra URLS <<< "$PRODUCTION_HEALTHCHECK_URLS"
          for raw_url in "${URLS[@]}"; do
            url="$(echo "$raw_url" | xargs)"
            [ -n "$url" ] || continue
            curl -fL --max-time 20 "$url" > /dev/null
            echo "Smoke check passed"
          done
