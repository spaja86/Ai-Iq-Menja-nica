name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tooling
        run: npm install -g htmlhint linkinator vercel

      - name: HTML validation
        run: htmlhint "**/*.html"

      - name: Metadata quality checks
        run: |
          grep -q 'rel="canonical"' index.html
          grep -q 'rel="canonical"' services.html
          grep -q 'rel="canonical"' contact.html
          grep -q 'rel="canonical"' trade.html
          grep -q 'rel="canonical"' wallet.html
          grep -q 'rel="canonical"' education.html

      - name: Content governance checks
        run: |
          grep -q 'spajicn@yahoo.com' contact.html
          grep -q 'demo/simulirane' trade.html
          grep -q 'Demo wallet' wallet.html
          grep -q 'serviceCatalog' services.html

      - name: Internal link validation
        run: linkinator . --recurse --skip "mailto:.*" --skip "https://(www\\.)?(instagram|facebook|youtube|tiktok)\\.com/.*" --skip "https://spaja86\\.github\\.io/Ai-Iq-World-Bank.*" --skip "https://spaja86\\.github\\.io/IO-OPENUI-AO.*" --skip "https://spaja86\\.github\\.io/Kompanija-SPAJA.*"

      - name: Install Vercel CLI
        run: vercel --version

      - name: Deploy to Vercel
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Post-deploy smoke check
        if: ${{ secrets.PRODUCTION_HEALTHCHECK_URL != '' }}
        run: |
          curl -fL --max-time 20 "${{ secrets.PRODUCTION_HEALTHCHECK_URL }}" > /dev/null
          echo "Smoke check passed for ${{ secrets.PRODUCTION_HEALTHCHECK_URL }}"
