name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tooling
        run: npm install -g htmlhint linkinator vercel

      - name: HTML validation
        run: htmlhint "**/*.html"

      - name: Metadata quality checks
        run: |
          set -euo pipefail
          pages=(
            index.html
            services.html
            contact.html
            trade.html
            wallet.html
            education.html
            about.html
            licensing.html
            institutional.html
            partner-onboarding.html
            trust-center.html
          )

          for page in "${pages[@]}"; do
            grep -q 'rel="canonical"' "$page"
            grep -q 'property="og:title"' "$page"
            grep -q 'property="og:description"' "$page"
          done

      - name: Content governance checks
        run: |
          set -euo pipefail
          grep -q 'spajicn@yahoo.com' contact.html
          grep -q 'spajicn@yahoo.com' licensing.html
          grep -q 'spajicn@yahoo.com' institutional.html
          grep -q 'spajicn@yahoo.com' partner-onboarding.html
          grep -q 'spajicn@yahoo.com' trust-center.html
          grep -qi 'formalni kanal' trust-center.html
          grep -qi 'demo/simulirane' index.html
          grep -qi 'simulirani podaci' trade.html
          grep -qi 'Demo wallet' wallet.html
          grep -q 'serviceCatalog' services.html

      - name: Internal link validation
        run: linkinator . --recurse --skip "mailto:.*" --skip "https://(www\\.)?(instagram|facebook|youtube|tiktok)\\.com/.*" --skip "https://spaja86\\.github\\.io/Ai-Iq-World-Bank.*" --skip "https://spaja86\\.github\\.io/IO-OPENUI-AO.*" --skip "https://spaja86\\.github\\.io/Kompanija-SPAJA.*"

      - name: Install Vercel CLI
        run: vercel --version

      - name: Deploy to Vercel
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Post-deploy smoke check (single URL)
        if: ${{ secrets.PRODUCTION_HEALTHCHECK_URL != '' }}
        run: |
          curl -fL --max-time 20 "${{ secrets.PRODUCTION_HEALTHCHECK_URL }}" > /dev/null
          echo "Smoke check passed for ${{ secrets.PRODUCTION_HEALTHCHECK_URL }}"

      - name: Post-deploy smoke checks (multiple URLs)
        if: ${{ secrets.PRODUCTION_HEALTHCHECK_URLS != '' }}
        run: |
          IFS=',' read -ra URLS <<< "${{ secrets.PRODUCTION_HEALTHCHECK_URLS }}"
          for raw_url in "${URLS[@]}"; do
            url="$(echo "$raw_url" | xargs)"
            [ -n "$url" ] || continue
            curl -fL --max-time 20 "$url" > /dev/null
            echo "Smoke check passed for $url"
          done
